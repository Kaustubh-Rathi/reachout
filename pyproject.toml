[project]
name = "reachout-crm"
version = "0.1.0"
description = "WhatsApp Outreach Automation and Local CRM Response Tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "camoufox[geoip]>=0.5.5",
    "fastapi>=0.100.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.20.0",
    "websockets>=16.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: marks browser end-to-end tests (run in the default suite)",
    "live_e2e: marks tests as live provider E2E tests (run with LIVE_E2E=1)",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI dependencies are intentionally called in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # package barrels re-export intentionally
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
"migrations/**" = ["E402"]

