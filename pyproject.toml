[project]
name = "reachout-crm"
version = "0.1.0"
description = "WhatsApp Outreach Automation and Local CRM Response Tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi>=0.100.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.20.0",
    "websockets>=16.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
